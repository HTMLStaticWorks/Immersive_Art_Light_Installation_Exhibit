<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16" />
      <stop offset="50%" stop-color="#040509" />
      <stop offset="100%" stop-color="#0e1022" />
    </linearGradient>

    <!-- Spectrum Gradient -->
    <linearGradient id="favPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="facetL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="facetR" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <radialGradient id="favGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#00f5d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#040509" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#favBg)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="8" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#favGlow)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#favPrism)" stroke-width="4" stroke-dasharray="14 10" opacity="0.8" />

  <!-- Center Gem Diamond -->
  <g transform="translate(256, 256)">
    <!-- Top-left facet -->
    <polygon points="0,-100 -80,-10 0,0" fill="url(#facetL)" opacity="0.95" />
    <!-- Top-right facet -->
    <polygon points="0,-100 80,-10 0,0" fill="url(#facetR)" opacity="0.95" />
    <!-- Bottom-left facet -->
    <polygon points="-80,-10 0,110 0,0" fill="#6366f1" opacity="0.9" />
    <!-- Bottom-right facet -->
    <polygon points="80,-10 0,110 0,0" fill="#ec4899" opacity="0.9" />

    <!-- Core sparkle -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
    <circle cx="0" cy="0" r="28" fill="#ffffff" opacity="0.3" />

    <!-- Light Rays -->
    <line x1="0" y1="-120" x2="0" y2="-105" stroke="#00f5d4" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="105" x2="0" y2="120" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" />
    <line x1="-120" y1="0" x2="-105" y2="0" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <line x1="105" y1="0" x2="120" y2="0" stroke="#f472b6" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
