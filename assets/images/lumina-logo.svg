<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70">
  <defs>
    <!-- Prismatic Gradients -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="facetGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="facetGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="lumGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luminous Prism Symbol -->
  <g transform="translate(14, 11)">
    <!-- Ambient glow circle -->
    <circle cx="24" cy="24" r="22" fill="url(#prismGrad)" opacity="0.15" filter="url(#lumGlow)" />
    
    <!-- Outer light ring -->
    <circle cx="24" cy="24" r="23" fill="none" stroke="url(#prismGrad)" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.75" />
    
    <!-- Central Refractive Crystal Gem -->
    <!-- Top-left facet -->
    <polygon points="24,6 12,20 24,24" fill="url(#facetGrad1)" opacity="0.95" />
    <!-- Top-right facet -->
    <polygon points="24,6 36,20 24,24" fill="url(#facetGrad2)" opacity="0.95" />
    <!-- Bottom-left facet -->
    <polygon points="12,20 24,42 24,24" fill="#6366f1" opacity="0.9" />
    <!-- Bottom-right facet -->
    <polygon points="36,20 24,42 24,24" fill="#ec4899" opacity="0.9" />

    <!-- Core light sparkle -->
    <circle cx="24" cy="24" r="2.5" fill="#ffffff" filter="url(#lumGlow)" />

    <!-- Subtle beam accents -->
    <line x1="24" y1="2" x2="24" y2="5" stroke="#00f5d4" stroke-width="2" stroke-linecap="round" />
    <line x1="24" y1="43" x2="24" y2="46" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
    <line x1="4" y1="24" x2="7" y2="24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="41" y1="24" x2="44" y2="24" stroke="#e879f9" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(76, 26)">
    <!-- LUMINA main logotype -->
    <text x="0" y="19" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="800" letter-spacing="4.5" fill="currentColor">
      LUMINA
    </text>
    
    <!-- Tagline / Subtitle -->
    <text x="1" y="34" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2.1" fill="#00f5d4" opacity="1">
      IMMERSIVE LIGHT EXHIBIT
    </text>
  </g>
</svg>
